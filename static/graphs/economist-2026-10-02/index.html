<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026-10-02-Economist Graphs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      max-width: 900px;
      margin: 48px auto;
      padding: 0 24px;
      color: #1a1a1a;
      background: #f9f8f6;
      line-height: 1.6;
    }
    header h1 {
      font-size: 2.2em;
      margin: 0 0 4px;
      border-bottom: 4px solid #e2001a;
      padding-bottom: 10px;
    }
    header p { color: #666; margin: 0 0 40px; }
    section { margin-bottom: 48px; }
    section > h2 {
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #e2001a;
      border-bottom: 1px solid #e2001a;
      padding-bottom: 4px;
      margin-bottom: 20px;
    }
    article {
      margin-bottom: 28px;
      padding-bottom: 28px;
      border-bottom: 1px solid #e0ddd8;
    }
    article:last-child { border-bottom: none; }
    .rubric {
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #e2001a;
      margin: 0 0 4px;
    }
    article h3 { font-size: 1.25em; margin: 0 0 6px; }
    article h3 a { color: #1a1a1a; text-decoration: none; }
    article h3 a:hover { text-decoration: underline; color: #e2001a; }
    .standfirst { font-size: 0.95em; color: #444; margin: 4px 0 12px; }
    .charts img {
      max-width: 100%;
      border: 1px solid #d8d5d0;
      display: block;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>The Economist</h1>
    <p>Print edition &mdash; 2026-10-02</p>
  </header>
  
</body>
</html>
